
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SimpleDownloaderAndroid_Starter.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q SimpleDownloaderAndroid_Starter.zip -d project

      - name: Build APK
        run: |
          gradle -p project/SimpleDownloaderAndroid :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDownloader-APK
          path: project/SimpleDownloaderAndroid/app/build/outputs/apk/debug/app-debug.apk
